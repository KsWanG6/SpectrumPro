name: Build SpectrumPro (macOS)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15            # Apple Silicon (arm64)
            arch: arm64
          - os: macos-15-intel      # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: app
        run: |
          python -m pip install -r requirements.txt pytest
          QT_QPA_PLATFORM=offscreen python -m pytest tests -q
      - name: Build
        working-directory: app
        run: bash packaging/macos/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SpectrumPro-macos-${{ matrix.arch }}
          path: app/dist/SpectrumPro-macos-${{ matrix.arch }}.zip
